<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xwy工坊</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f3f0, #e8e5de);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: linear-gradient(to bottom, #f9f9f9, #f0f0f0);
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            position: relative;
            overflow: hidden;
            padding: 40px 30px;
            margin: 20px;
        }
        

        .circle-decor-1 {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            opacity: 0.2;
            z-index: 0;
        }
        
        .circle-decor-2 {
            position: absolute;
            bottom: 40px;
            left: 30px;
            width: 40px;
            height: 40px;
            border: 2px solid #d4af37;
            border-radius: 50%;
            opacity: 0.15;
            z-index: 0;
        }
        
        .header-section {
            text-align: center;
            margin-bottom: 50px;
            padding: 20px 0 30px;
            border-bottom: 1px solid rgba(180, 150, 100, 0.2);
            position: relative;
            z-index: 1;
        }
        
        .header-section h1 {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 1px;
            color: #333;
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }
        
        .header-section h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
        }
        
        .license-tag {
            margin-top: 20px;
        }
        
        .license-tag a {
            text-decoration: none;
        }
        
        .license-badge {
            display: inline-block;
            background: rgba(180, 150, 100, 0.1);
            border: 1px solid rgba(180, 150, 100, 0.3);
            border-radius: 6px;
            padding: 7px 15px;
            font-size: 0.95rem;
            color: #5a5a5a;
            transition: all 0.3s ease;
        }
        
        .license-badge span {
            color: #d4af37;
            font-weight: 500;
        }
        
        .cards-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            margin: 40px 0 60px;
            position: relative;
            z-index: 1;
        }
        
        .card {
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }
        
        .card-inner {
            text-align: center;
            width: 190px;
            padding: 25px 20px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(180, 150, 100, 0.1);
            transition: all 0.3s ease;
        }
        
        .card-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 18px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(180, 150, 100, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .card-icon svg {
            width: 36px;
            height: 36px;
        }
        
        .card-title {
            display: block;
            font-size: 1.2rem;
            color: #5a5a5a;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        
        .design-signature {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(180, 150, 100, 0.15);
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 1px;
            transform: rotate(-5deg);
            z-index: 0;
        }
        
        .card:hover .card-inner {
            transform: translateY(-8px);
        }
        
        .card:hover .card-icon {
            transform: translateY(-5px);
            background: rgba(212, 175, 55, 0.15);
            border-color: rgba(180, 150, 100, 0.4);
        }
        
        .card:hover .card-title {
            color: #d4af37;
        }
        
        .license-badge:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: rgba(180, 150, 100, 0.5);
        }
        

        @media (max-width: 768px) {
            .header-section h1 {
                font-size: 2.4rem;
            }
            
            .cards-container {
                gap: 20px;
            }
            
            .card-inner {
                width: 160px;
                padding: 20px;
            }
        }
        
        @media (max-width: 576px) {
            .container {
                padding: 30px 20px;
            }
            
            .header-section h1 {
                font-size: 2rem;
            }
            
            .header-section {
                margin-bottom: 40px;
            }
            
            .cards-container {
                flex-direction: column;
                align-items: center;
                gap: 25px;
            }
            
            .card-inner {
                width: 220px;
            }
            
            .license-badge {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
         <div class="circle-decor-1"></div>
        <div class="circle-decor-2"></div>
        <div class="header-section">
            <h1>xwy工坊</h1>
            <div class="license-tag">
                <a href="https://www.gnu.org/licenses/gpl-3.0">
                    <div class="license-badge">
                        <span>License:</span> GPL v3
                    </div>
                </a>
            </div>
        </div>
        
        <div class="cards-container">
            <a href="试卷.html" class="card">
                <div class="card-inner">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                    </div>
                    <span class="card-title">试卷合集</span>
                </div>
            </a>
            
            <a href="other.html" class="card">
                <div class="card-inner">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                    </div>
                    <span class="card-title">其他公告</span>
                </div>
            </a>
        </div>
        
        <div class="design-signature">
            xwy工坊
        </div>
    </div>
</body>
</html>
